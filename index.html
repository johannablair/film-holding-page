<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Silent Film</title>
  <meta name="description" content="Silent Film — a filmette.">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .film-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    /* Landscape / desktop: film fills the screen */
    #player {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-width: 177.78vh;
      min-height: 100vh;
      min-width: 177.78dvh;
      min-height: 100dvh;
      transform: translate(-50%, -50%);
      border: none;
      pointer-events: none;
    }

    /* Portrait (phones held upright): show the whole film, centred */
    @media (orientation: portrait) {
      #player {
        width: 100vw;
        height: 56.25vw;
        min-width: 0;
        min-height: 0;
      }
    }

    /* Rotate-your-phone hint: icon only, portrait on touch devices only */
    .rotate-hint {
      display: none;
      position: fixed;
      left: 50%;
      top: calc(50% + 28.125vw + 32px);
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 5;
    }

    .rotate-hint svg {
      display: block;
      width: 40px;
      height: 40px;
      fill: none;
      stroke: rgba(255, 255, 255, 0.7);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      animation: tilt 3.5s ease-in-out infinite;
    }

    @keyframes tilt {
      0%, 20% { transform: rotate(0deg); }
      50%, 75% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      .rotate-hint {
        display: block;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rotate-hint svg {
        animation: none;
        transform: rotate(-90deg);
      }
    }

    /* Volume control */
    .volume {
      position: fixed;
      right: 24px;
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .volume.visible,
    .volume:hover,
    .volume:focus-within {
      opacity: 1;
    }

    .volume button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .volume svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .volume .icon-muted { display: none; }
    .volume.is-muted .icon-on { display: none; }
    .volume.is-muted .icon-muted { display: block; }

    .volume input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.4);
      outline: none;
      cursor: pointer;
    }

    .volume input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: none;
    }

    .volume input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: none;
    }

    /* On phones and tablets the device's own volume buttons control loudness,
       so only the mute icon is shown */
    @media (hover: none) and (pointer: coarse) {
      .volume input[type="range"] {
        display: none;
      }
    }

    /* Seek bar */
    .seek {
      position: fixed;
      left: 24px;
      right: 24px;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .seek.visible,
    .seek:hover,
    .seek:focus-within {
      opacity: 1;
    }

    .seek input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      height: 28px; /* large touch area, thin visible line */
      background: transparent;
      outline: none;
      cursor: pointer;
      --p: 0%;
    }

    .seek input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(to right, #fff var(--p), rgba(255, 255, 255, 0.35) var(--p));
    }

    .seek input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      margin-top: -4.5px;
      border-radius: 50%;
      background: #fff;
      border: none;
    }

    .seek input[type="range"]::-moz-range-track {
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.35);
    }

    .seek input[type="range"]::-moz-range-progress {
      height: 3px;
      border-radius: 2px;
      background: #fff;
    }

    .seek input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: none;
    }
  </style>
</head>

<body>

  <main class="film-container">
    <div id="player"></div>
  </main>

  <div class="rotate-hint" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <rect x="6.5" y="2.5" width="11" height="19" rx="2.5"></rect>
      <line x1="10.5" y1="18.5" x2="13.5" y2="18.5"></line>
    </svg>
  </div>

  <div class="volume is-muted" id="volume">
    <button id="muteBtn" type="button" aria-label="Toggle sound">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
        <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
      </svg>
      <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="22" y1="9" x2="16" y2="15"></line>
        <line x1="16" y1="9" x2="22" y2="15"></line>
      </svg>
    </button>
    <input id="volumeSlider" type="range" min="0" max="100" value="100" aria-label="Volume">
  </div>

  <div class="seek" id="seekWrap">
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
  </div>

  <script>
    // YouTube video ID (the part after "v=" in the YouTube link)
    var VIDEO_ID = '0rHxK0Hjqnw';

    var player;
    var volumeEl = document.getElementById('volume');
    var seekWrap = document.getElementById('seekWrap');
    var muteBtn = document.getElementById('muteBtn');
    var slider = document.getElementById('volumeSlider');
    var seekEl = document.getElementById('seek');
    var hideTimer;
    var dragging = false;

    // Load the YouTube IFrame API
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 1,
          origin: window.location.origin,
          mute: 1,
          controls: 0,
          rel: 0,
          playsinline: 1,
          modestbranding: 1,
          iv_load_policy: 3,
          cc_load_policy: 0,
          disablekb: 1,
          fs: 0,
          loop: 1,
          playlist: VIDEO_ID
        },
        events: {
          onReady: function (e) {
            e.target.mute();
            e.target.playVideo();
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.ENDED) {
              player.seekTo(0);
              player.playVideo();
            }
          }
        }
      });
    }

    function setMutedUI(muted) {
      volumeEl.classList.toggle('is-muted', muted);
    }

    // Mute button
    muteBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (!player) return;
      if (player.isMuted()) {
        player.unMute();
        if (player.getVolume() === 0) {
          player.setVolume(100);
          slider.value = 100;
        }
        setMutedUI(false);
      } else {
        player.mute();
        setMutedUI(true);
      }
    });

    // Volume slider
    slider.addEventListener('input', function () {
      if (!player) return;
      var v = Number(slider.value);
      player.setVolume(v);
      if (v === 0) {
        player.mute();
        setMutedUI(true);
      } else {
        player.unMute();
        setMutedUI(false);
      }
    });

    // Seek bar: update the filled part while dragging, jump when released
    function setSeekFill(fraction) {
      seekEl.style.setProperty('--p', (fraction * 100) + '%');
    }

    seekEl.addEventListener('input', function () {
      dragging = true;
      setSeekFill(seekEl.value / 1000);
    });

    seekEl.addEventListener('change', function () {
      if (player && player.getDuration) {
        var d = player.getDuration();
        if (d) {
          player.seekTo((seekEl.value / 1000) * d, true);
        }
      }
      dragging = false;
    });

    seekEl.addEventListener('pointerup', function () {
      setTimeout(function () { dragging = false; }, 300);
    });

    // Keep the seek bar in step with the film
    setInterval(function () {
      if (!player || !player.getDuration || dragging) return;
      var d = player.getDuration();
      if (!d) return;
      var f = player.getCurrentTime() / d;
      seekEl.value = Math.round(f * 1000);
      setSeekFill(f);
    }, 250);

    // Turn sound on at the first click, tap or key press anywhere on the page
    var interactionEvents = ['click', 'touchend', 'keydown'];

    function enableSoundOnFirstInteraction(e) {
      // Let the volume controls handle their own clicks
      if (e.target && e.target.closest && e.target.closest('#volume')) {
        removeInteractionListeners();
        return;
      }
      if (player && player.isMuted && player.isMuted()) {
        player.unMute();
        player.setVolume(Number(slider.value) || 100);
        setMutedUI(false);
      }
      removeInteractionListeners();
    }

    function removeInteractionListeners() {
      interactionEvents.forEach(function (evt) {
        document.removeEventListener(evt, enableSoundOnFirstInteraction);
      });
    }

    interactionEvents.forEach(function (evt) {
      document.addEventListener(evt, enableSoundOnFirstInteraction);
    });

    // Show controls on movement / touch, fade out when idle
    function showControls() {
      volumeEl.classList.add('visible');
      seekWrap.classList.add('visible');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        volumeEl.classList.remove('visible');
        seekWrap.classList.remove('visible');
      }, 2500);
    }

    ['mousemove', 'touchstart', 'keydown'].forEach(function (evt) {
      document.addEventListener(evt, showControls, { passive: true });
    });

    showControls();
  </script>

</body>
</html>
