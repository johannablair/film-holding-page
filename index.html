<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Silver Daydream</title>

  <meta name="description" content="Silver Daydream — A film.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .film-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .film-container iframe {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 100vw;
      height: 56.25vw;

      min-width: 177.78vh;
      min-height: 100vh;

      transform: translate(-50%, -50%);

      border: none;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <main class="film-container">

    <iframe
      src="https://www.youtube.com/embed/4NdDRfw938s?autoplay=1&mute=1&loop=1&playlist=4NdDRfw938s&controls=0&rel=0&playsinline=1&modestbranding=1"
      title="Silver Daydream"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen>
    </iframe>

  </main>

</body>
</html>
