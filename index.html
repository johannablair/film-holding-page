<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silver Daydream</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .video-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="video-container">
    <iframe
      id="silverdaydream-film"
      src="https://player.vimeo.com/video/1237001898?autoplay=1&loop=1&muted=1&autopause=0"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      title="Silver Daydream">
    </iframe>
  </div>

  <script src="https://player.vimeo.com/api/player.js"></script>

  <script>
    const iframe = document.getElementById('silverdaydream-film');
    const player = new Vimeo.Player(iframe);

    player.setLoop(true).catch(function(error) {
      console.log('Vimeo loop setting:', error);
    });

    player.setMuted(true).catch(function(error) {
      console.log('Vimeo mute setting:', error);
    });
  </script>

</body>
</html>
